services:
  - type: web
    name: touchgrass
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMMA_MODEL
        value: gemma-2-9b-it
      - key: GEMMA_VISION_MODEL
        value: paligemma-3b-mix-448
      - key: GEMMA_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMMA_API_KEY
        sync: false
